name: Build Debug APK and Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java environment
        shell: bash
        run: |
          set -euo pipefail
          java -version
          echo "JAVA_HOME=${JAVA_HOME:-}"

          JAVA_VERSION_LINE="$(java -version 2>&1 | head -n 1 || true)"
          if [[ "$JAVA_VERSION_LINE" =~ \"([0-9]+)(\.[0-9]+)? ]]; then
            JAVA_MAJOR="${BASH_REMATCH[1]}"
            if [ "$JAVA_MAJOR" = "1" ] && [[ "$JAVA_VERSION_LINE" =~ \"1\.([0-9]+) ]]; then
              JAVA_MAJOR="${BASH_REMATCH[1]}"
            fi
          else
            echo "::error::Unable to detect the active Java version from: $JAVA_VERSION_LINE"
            exit 1
          fi

          echo "Detected Java major version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, but detected Java $JAVA_MAJOR."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="./debug.keystore"
          KEYTOOL_BIN="${JAVA_HOME:-}/bin/keytool"

          if [ ! -x "$KEYTOOL_BIN" ]; then
            echo "::error::keytool not found in configured Java 17 installation at: $KEYTOOL_BIN"
            exit 1
          fi

          if [ ! -f "$KEYSTORE_PATH" ]; then
            echo "Generating temporary debug keystore..."
            "$KEYTOOL_BIN" -genkeypair \
              -v \
              -keystore "$KEYSTORE_PATH" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1 || {
                echo "::error::Failed to create temporary debug keystore."
                exit 1
              }
          else
            echo "Existing debug keystore detected; skipping generation."
          fi

          if [ ! -f "$KEYSTORE_PATH" ] || [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::Temporary debug keystore is missing or empty after creation step."
            exit 1
          fi

      - name: Build debug APK
        shell: bash
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -e "$EXPECTED_APK" ]; then
            echo "::error::Expected debug APK not found at: $EXPECTED_APK"
            if [ -d "app/build/outputs/apk" ]; then
              echo "APK files discovered inside app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name "*.apk" -print || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::Expected path is not a regular file: $EXPECTED_APK"
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::Expected debug APK is empty: $EXPECTED_APK"
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "::error::Expected file does not have .apk extension: $EXPECTED_APK"
              exit 1
              ;;
          esac

          echo "Verified debug APK: $EXPECTED_APK ($(wc -c < "$EXPECTED_APK") bytes)"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$SOURCE_APK" ] || [ ! -s "$SOURCE_APK" ]; then
            echo "::error::Verified debug APK is missing or empty: $SOURCE_APK"
            exit 1
          fi

          RAW_REPO="${GITHUB_REPOSITORY##*/}"
          SANITIZED_REPO="$(printf '%s' "$RAW_REPO" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/-+/-/g; s/^[-.]+//; s/[-.]+$//')"
          if [ -z "$SANITIZED_REPO" ]; then
            SANITIZED_REPO="android-app"
          fi

          RELEASE_ASSET_DIR="$(mktemp -d "${RUNNER_TEMP:-/tmp}/apk-release.XXXXXX")"
          ASSET_NAME="${SANITIZED_REPO}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          ASSET_PATH="${RELEASE_ASSET_DIR}/${ASSET_NAME}"

          cp "$SOURCE_APK" "$ASSET_PATH"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Prepared release asset is missing or empty: $ASSET_PATH"
            exit 1
          fi

          {
            echo "asset_path=${ASSET_PATH}"
            echo "asset_name=${ASSET_NAME}"
          } >> "$GITHUB_OUTPUT"

          echo "Prepared release asset filename: ${ASSET_NAME}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v gh >/dev/null 2>&1; then
            echo "::warning::GitHub CLI (gh) is not available on this runner."
            exit 1
          fi
          gh --version

          if [ -z "${ASSET_PATH:-}" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::warning::Prepared release asset does not exist or is empty: ${ASSET_PATH:-}"
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "::warning::Prepared release asset does not have the .apk extension: $ASSET_PATH"
              exit 1
              ;;
          esac

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          NOTES_FILE="$(mktemp "${RUNNER_TEMP:-/tmp}/release-notes.XXXXXX.md")"
          cat <<EOF > "$NOTES_FILE"
          This is an automatically generated debug APK built by GitHub Actions.

          - **GitHub Actions Run Number:** ${GITHUB_RUN_NUMBER}
          - **GitHub Actions Run Attempt:** ${GITHUB_RUN_ATTEMPT}
          - **Source Commit SHA:** ${GITHUB_SHA}
          - **APK Asset:** ${ASSET_NAME}

          **Important Notes:**
          - This APK is intended for testing on Android devices.
          - This APK is not a Play Store production release.
          - This APK is signed only with a temporary debug keystore.
          EOF

          gh release create "$RELEASE_TAG" \
            "$ASSET_PATH" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file "$NOTES_FILE" \
            --latest

      - name: Report APK download result
        if: always() && steps.upload_artifact.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            CONFIRMED_TAG="$(gh release view "$RELEASE_TAG" --json tagName --jq '.tagName')"
            CONFIRMED_TITLE="$(gh release view "$RELEASE_TAG" --json name --jq '.name')"
            RELEASE_URL="$(gh release view "$RELEASE_TAG" --json url --jq '.url')"
            CONFIRMED_ASSET="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | head -n 1)"

            echo "GitHub Release published successfully."
            echo "Release Tag: ${CONFIRMED_TAG}"
            echo "Release Title: ${CONFIRMED_TITLE}"
            echo "Release URL: ${RELEASE_URL}"
            echo "APK Asset Filename: ${CONFIRMED_ASSET}"

            {
              echo "## Debug APK Build & Release Summary"
              echo ""
              echo "- **APK Build:** Succeeded"
              echo "- **Actions Artifact:** \`app-debug-apk\` (available as backup)"
              echo "- **Release Status:** Published"
              echo "- **Release Tag:** \`${CONFIRMED_TAG}\`"
              echo "- **Release Title:** ${CONFIRMED_TITLE}"
              echo "- **APK Asset Filename:** \`${CONFIRMED_ASSET}\`"
              echo "- **Download Page:** ${RELEASE_URL}"
              echo ""
              echo "You can download \`${CONFIRMED_ASSET}\` directly from the **Assets** section on the GitHub Release page above, or use the \`app-debug-apk\` Actions artifact as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed, but the debug APK build succeeded and the Actions artifact 'app-debug-apk' remains available."

            {
              echo "## Debug APK Build & Release Summary"
              echo ""
              echo "- **APK Build:** Succeeded"
              echo "- **Actions Artifact:** \`app-debug-apk\` (available for download)"
              echo "- **Release Status:** Failed (warning)"
              echo ""
              echo "> **Warning:** Publishing the APK to GitHub Releases failed. Your debug APK build succeeded and can still be downloaded from the **\`app-debug-apk\`** artifact in this workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
